<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: #272727;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .wrap {
    position: absolute; inset: 0 0 16px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .logo { width: 380px; height: 380px; mix-blend-mode: lighten; margin: -12px 0 -36px; }
  h1 {
    color: #d3d3d3;
    font-size: 124px;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
    margin-bottom: 28px;
  }
  .tagline {
    font-size: 46px;
    font-weight: 500;
    line-height: 1.25;
    margin-bottom: 56px;
  }
  .handle {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 16px 36px 16px 28px;
    border-radius: 999px;
    background: #fa4345;
    color: #1a1a1a;
    font-size: 40px;
    font-weight: 700;
  }
  .handle svg { width: 42px; height: 42px; }
  .handle + .handle { margin-top: 20px; }
  .handle.cyan { background: #08f8f9; }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; display: flex; }
  .stripe span { flex: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../logo.jpg" alt="">
    <h1>conversae.org</h1>
    <p class="tagline">Chega junto, vem pensar coletivo!</p>
    <span class="handle cyan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      coletivo@conversae.org
    </span>
    <span class="handle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      @conversaesm
    </span>
  </div>
  <div class="stripe"><span style="background:#fa4345"></span><span style="background:#08f8f9"></span></div>
</body>
</html>
